name: Permanent Linux RDP & SSH Server

on:
  workflow_dispatch:        # اجرای دستی با دکمه Run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # بازیابی هارد ابری دائمی
      - name: 2. Restore Persistent Workspace
        uses: actions/cache@v4
        with:
          path: /home/behrad/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: 3. Setup OpenSSH & Desktop Environment (XFCE + RDP)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils
          
          # افزودن دسترسی xrdp به گواهی‌ها
          sudo adduser xrdp ssl-cert
          
          # فعال‌سازی لاگین با پسورد برای SSH
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: 4. Create User (behrad) with Root Access & Fix RDP D-Bus
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash behrad || true
          echo "behrad:$SERVER_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo behrad
          echo "behrad ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/behrad
          
          # حل مشکل D-Bus و لود نشدن نشست XFCE
          cat << 'EOF' | sudo tee /home/behrad/.xsession
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec dbus-launch --exit-with-session startxfce4
          EOF
          
          sudo chown behrad:behrad /home/behrad/.xsession
          
          # ری‌استارت سرویس xrdp
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          
          # ساخت و مجوز پوشه هارد دائمی
          sudo mkdir -p /home/behrad/workspace
          sudo chown -R behrad:behrad /home/behrad/workspace

      - name: 5. Connect Tailscale VPN & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="cynet-linux-desktop"
          
          TS_IP=$(tailscale ip -4)
          
          echo "=================================================="
          echo "  >>> PERMANENT LINUX DESKTOP & SSH IS LIVE! <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  Username      : behrad"
          echo "  Password      : (Read from Secret: SERVER_PASSWORD)"
          echo "  ------------------------------------------------"
          echo "  🖥️ Connect via RDP (Remote Desktop):"
          echo "  >> IP: $TS_IP"
          echo "  ------------------------------------------------"
          echo "  💻 Connect via SSH (Terminal):"
          echo "  >> ssh behrad@$TS_IP"
          echo "  ------------------------------------------------"
          echo "  💾 Persistent Folder : /home/behrad/workspace"
          echo "=================================================="

      - name: 6. Server Keep-Alive (5h 55m)
        run: |
          for i in {1..355}; do
            sleep 60
            echo "[$i/355] Linux Desktop Server is active..."
          done

      # ذخیره خودکار فایل‌های پوشه دائمی قبل از ری‌استارت
      - name: 7. Save Workspace to Cloud
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/behrad/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
